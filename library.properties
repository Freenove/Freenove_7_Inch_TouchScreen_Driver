sentence=ESP32-P4 only. Driver for the Freenove 7-inch 1024x600 MIPI-DSI C-type panel (EK79007 + GT911 + I2C panel MCU).
paragraph=ESP32-P4 only (MIPI-DSI). Fully self-contained: panel power/reset and backlight via on-panel MCU I2C (0x45). Exposes an RGB565 framebuffer for LVGL or direct drawing, and reads GT911 touch over Wire. Other ESP32 chips will fail at compile time.
